<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MITEZ | Make It Easy</title>
<meta name="description" content="MITEZ makes it easy to learn anything, free mentorship and hands-on help, for anyone who asks. Based in Gainesville, Florida." />

<!-- OpenGraph / Twitter cards: without these, any link shared to iMessage,
     Slack, WhatsApp or social renders as a bare URL with no title, blurb
     or image. Missing OG data is one of the most common "shipped fast,
     never cleaned up" tells. og:image is a purpose-built 1200x630 card
     (/og-image.png) using the mark recoloured for the light theme; the
     favicons and apple-touch-icon are deliberately left on the original
     artwork. These values are the DEFAULT, scripts/prerender-meta.mjs
     overwrites them per route at build time so shared links preview
     correctly. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MITEZ" />
<meta property="og:title" content="MITEZ | Learn anything, free" />
<meta property="og:description" content="Free mentorship in whatever you want to learn. Based in Gainesville, Florida." />
<meta property="og:url" content="https://mitez.org/" />
<meta property="og:image" content="https://mitez.org/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="MITEZ. Make It Easy" />
<meta property="og:locale" content="en_US" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="MITEZ | Learn anything, free" />
<meta name="twitter:description" content="Free mentorship in whatever you want to learn. Based in Gainesville, Florida." />
<meta name="twitter:image" content="https://mitez.org/og-image.png" />
<link rel="canonical" href="https://mitez.org/" />
<meta name="theme-color" content="#f2f2f2" />

<!-- Favicons, largest first, browsers and Googlebot-Image pick the best
     available, and the order makes the intended one obvious.
     Google's favicon docs recommend an icon LARGER than 48x48, and sizes
     that are multiples of 48, hence 48 / 96 / 192 below.

     The icons carry an opaque dark background on purpose. The mark is a
     white hand, and it previously shipped on transparency: on the white
     card Google renders favicons against, the white outer hand vanished
     and only the small dark inner hand survived, which is why Search
     showed an unrecognisable dark blob. Baking the brand dark in makes the
     icon read the same everywhere, and Google's circular crop then frames
     it the way the mark was designed.
     /favicon.ico is also the path both browsers and Google probe by
     default even with no link tag present, so it should always exist. -->
<!-- SVG first, and it is doing real work rather than being modern for
     its own sake. The mark is now transparent, and a transparent WHITE
     hand is invisible on a white surface — which is exactly the failure
     the old opaque dark square was added to solve. Instead of bringing
     that square back, this file carries both marks and switches on
     prefers-color-scheme: the white hand on a dark tab strip, the black
     hand on a light one. Any browser that supports SVG icons (Chrome,
     Edge, Firefox, Safari 16.4+) uses this and is never caught out. The
     PNGs below remain the fallback for everything else. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@200;300;400;500;600&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Structured data: tells Google what MITEZ actually is (an education /
     mentorship org) rather than leaving it to guess from the page text.
     Deliberately typed as EducationalOrganization, not NGO or
     LocalBusiness with a nonprofit designation. MITEZ is not legally
     incorporated yet, and this schema makes no claim about that either
     way. Update this once the legal structure is real. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "EducationalOrganization",
  "name": "MITEZ",
  "alternateName": "Make It Easy",
  "url": "https://mitez.org",
  "logo": "https://mitez.org/apple-touch-icon.png",
  "description": "MITEZ is free mentorship and hands-on support for anything you want to learn, based in Gainesville, Florida.",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Gainesville",
    "addressRegion": "FL",
    "addressCountry": "US"
  },
  "areaServed": "Gainesville, Florida",
  "email": "hello@mitez.org"
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
